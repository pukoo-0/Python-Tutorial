<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EAF0F3;
  --surface: #FFFFFF;
  --ink: #18263A;
  --muted: #5B6B7E;
  --line: #C9D5DE;
  --accent: #2F7D5B;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE5;
  --error: #B4412E;
  --error-soft: #F7E1DC;
  --code-bg: #F4F7F9;
  --out-bg: #18263A;
  --out-ink: #E3EAF0;
  --grid: rgba(24, 38, 58, 0.05);
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1720; --surface: #16212C; --ink: #E3EAF0; --muted: #93A3B3; --line: #2A3947;
    --accent: #5FC497; --accent-ink: #0B1B13; --accent-soft: #183A2C; --error: #F08A74; --error-soft: #3A1F1A;
    --code-bg: #0E1821; --out-bg: #070D13; --out-ink: #CFE0D7; --grid: rgba(227, 234, 240, 0.04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1720; --surface: #16212C; --ink: #E3EAF0; --muted: #93A3B3; --line: #2A3947;
  --accent: #5FC497; --accent-ink: #0B1B13; --accent-soft: #183A2C; --error: #F08A74; --error-soft: #3A1F1A;
  --code-bg: #0E1821; --out-bg: #070D13; --out-ink: #CFE0D7; --grid: rgba(227, 234, 240, 0.04);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; font-family: var(--sans); font-size: 17px; line-height: 1.55; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, pre, textarea { font-family: var(--mono); }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; }

.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; padding: 28px 20px 24px; border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 85%, transparent);
}
.brand { font-weight: 700; font-size: 1.2rem; margin: 0 0 2px; }
.brand-sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 22px; }
.progress-label { font-size: 0.85rem; color: var(--muted); }
.progress-num { font-family: var(--mono); font-size: 2rem; font-weight: 600; line-height: 1.15; }
.bar { height: 8px; border-radius: 4px; background: var(--code-bg); border: 1px solid var(--line); overflow: hidden; margin: 8px 0 6px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s ease; }
.progress-note { font-size: 0.85rem; color: var(--muted); }
.modlist { list-style: none; padding: 0; margin: 0; }
.mod-btn { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px; }
.mod-btn:hover { background: var(--surface); }
.mod-btn[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
.mod-n { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.mod-count { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.mod-count.full { color: var(--accent); font-weight: 600; }
.engine { margin-top: 20px; font-size: 0.82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #C9A227; flex: none; }
.dot.ok { background: var(--accent); }
.dot.bad { background: var(--error); }
.reset { margin-top: 14px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.82rem; text-decoration: underline; }

main { padding: 32px 40px 80px; min-width: 0; }
.lesson-head h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
.lesson-head p { margin: 0; color: var(--muted); max-width: 62ch; }

.learn { margin: 22px 0 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.learn > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.learn > summary::-webkit-details-marker { display: none; }
.learn > summary::after { content: "Show"; font-weight: 400; font-size: 0.85rem; color: var(--muted); text-decoration: underline; }
.learn[open] > summary::after { content: "Hide"; }
.learn-body { padding: 4px 18px 18px; }
.block { padding: 14px 0; border-top: 1px solid var(--line); max-width: 72ch; }
.block:first-child { border-top: 0; padding-top: 4px; }
.block-step { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
.block p { margin: 0 0 8px; }
.block p:last-child { margin-bottom: 0; }
.sample { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 10px 0 6px; font-size: 14px; }
.sample pre { margin: 0; padding: 10px 12px; white-space: pre; overflow-x: auto; }
.sample .s-code { background: var(--code-bg); }
.sample .s-out { background: var(--out-bg); color: var(--out-ink); }
.sample .s-tag { display: block; font-family: var(--sans); font-size: 0.72rem; opacity: 0.7; margin-bottom: 4px; }
.sample.solo { grid-template-columns: 1fr; }
code.i { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 0.88em; white-space: nowrap; }
.tip { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.try-head { margin: 18px 0 8px; font-weight: 700; }

.ex-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; }
.step { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 0.85rem; display: grid; place-items: center; }
.step[aria-current="true"] { border-color: var(--ink); border-width: 2px; }
.step.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex-title { font-size: 1.3rem; margin: 0; }

.task { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; max-width: 78ch; }
.task p { margin: 0 0 8px; }
.task p:last-child { margin-bottom: 0; }

.editor-wrap { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.editor-wrap:focus-within { border-color: var(--accent); }
.editor-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 12px; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--line); }
textarea.code { display: block; width: 100%; min-height: 160px; resize: vertical; border: 0; outline: none; padding: 14px 16px; background: transparent; color: var(--ink); font-size: 15px; line-height: 1.55; tab-size: 4; white-space: pre; overflow-x: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.btn { border-radius: 8px; padding: 9px 16px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 0.95rem; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; font-weight: 400; text-decoration: underline; padding-left: 6px; padding-right: 6px; }
.btn:disabled { opacity: 0.5; cursor: default; }

.console { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.console-head { padding: 8px 14px; font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid var(--line); }
.console pre { margin: 0; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; min-height: 48px; max-height: 320px; overflow: auto; }
.console.pass { border-color: var(--accent); }
.console.pass .console-head { background: var(--accent-soft); }
.console.fail .console-head { background: var(--error-soft); }
.verdict { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 0.95rem; }
.verdict.pass { color: var(--accent); font-weight: 700; }
.verdict.fail { color: var(--error); }
.err-line { color: var(--error); }

.helper { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); max-width: 78ch; }
.helper h3 { font-size: 0.95rem; margin: 0 0 6px; }
.helper p { margin: 0; }
.helper pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; margin: 8px 0 0; }

.next-row { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }
.finish { background: var(--accent-soft); border-radius: 12px; padding: 18px 20px; margin-top: 22px; max-width: 78ch; }
.finish h2 { margin: 0 0 6px; font-size: 1.2rem; }
.finish p { margin: 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 18px 16px 12px; }
  .progress { padding: 10px 12px; margin-bottom: 12px; }
  .progress-num { font-size: 1.5rem; }
  .modlist { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .mod-btn { white-space: nowrap; grid-template-columns: auto auto auto; }
  .mod-btn[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  main { padding: 22px 16px 60px; }
  .lesson-head h1 { font-size: 1.6rem; }
  .sample { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script type="text/python" id="py-bridge">
from browser import window
import sys

class _Out:
    def __init__(self):
        self.buf = []
    def write(self, s):
        self.buf.append(str(s))
    def flush(self):
        pass

def _run(code, check, token):
    out = _Out()
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = out
    sys.stderr = out
    ns = {"__name__": "__main__"}
    err = ""
    try:
        exec(code, ns)
    except SyntaxError as e:
        line = getattr(e, "lineno", None)
        msg = getattr(e, "msg", None) or str(e)
        err = type(e).__name__ + (" on line " + str(line) if line else "") + ": " + str(msg)
    except Exception as e:
        err = type(e).__name__ + ": " + str(e)
    finally:
        sys.stdout = old_out
        sys.stderr = old_err
    text = "".join(out.buf)
    ok = False
    msg = ""
    if not err and check:
        ns["__output__"] = text
        ns["__code__"] = code
        out2 = _Out()
        sys.stdout = out2
        try:
            exec(check, ns)
            ok = True
        except AssertionError as e:
            msg = str(e)
        except Exception as e:
            msg = "While testing your code: " + type(e).__name__ + ": " + str(e)
        finally:
            sys.stdout = old_out
    window.pyDone(token, ok, text, err, msg)

window.pyRun = _run
</script>

def expect(cond, msg):
    if not cond:
        raise AssertionError(msg)
def near(a, b, tol=1e-6):
    try:
        return abs(a - b) <= tol
    except Exception:
        return False
def lines():
    return [l.strip() for l in __output__.strip().splitlines() if l.strip()]
def defined(name):
    return name in globals()
def is_num(x):
    return isinstance(x, (int, float)) and not isinstance(x, bool)
`;

/* ---------- State ---------- */
const STORE_KEY = "pyzero-progress-v1";
let state = { done: {}, code: {}, mod: 0, ex: 0 };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && typeof saved === "object") state = Object.assign(state, saved);
} catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const ALL_EX = MODULES.flatMap(m => m.exercises.map(x => x.id));
const TOTAL = ALL_EX.length;

/* ---------- Python engine ---------- */
let engine = "loading";
const pending = {};
let tokenSeq = 0;
window.pyDone = function (token, ok, out, err, msg) {
  const r = pending[token];
  if (r) { delete pending[token]; r({ ok: !!ok, out: String(out || ""), err: String(err || ""), msg: String(msg || "") }); }
};
function setEngine(kind) {
  engine = kind;
  const dot = document.getElementById("engine-dot");
  const txt = document.getElementById("engine-text");
  dot.className = "dot" + (kind === "ready" ? " ok" : kind === "none" ? " bad" : "");
  txt.textContent = kind === "ready" ? "Python is ready" : kind === "none" ? "Python couldn’t start. Reload the page." : "Starting Python…";
}
function startEngineWatch() {
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    if (typeof window.pyRun === "function") { clearInterval(timer); setEngine("ready"); return; }
    if (tries === 6 && typeof window.brython === "function") { try { window.brython({ debug: 1 }); } catch (e) {} }
    if (tries > 40) { clearInterval(timer); setEngine("none"); }
  }, 500);
}
function runPython(code, check) {
  if (engine !== "ready") return Promise.resolve({ ok: false, out: "", err: "", msg: "Python is still starting. Wait a few seconds and try again." });
  return new Promise(resolve => {
    const token = "t" + (++tokenSeq);
    pending[token] = resolve;
    setTimeout(() => {
      try { window.pyRun(code, check ? PRELUDE + "\n" + check : "", token); }
      catch (e) { delete pending[token]; resolve({ ok: false, out: "", err: "Something went wrong running your code: " + e.message, msg: "" }); }
    }, 20);
  });
}

const FRIENDLY = {
  NameError: "Python doesn’t know this name. Check the spelling, or create the variable before using it.",
  TypeError: "You mixed types that don’t go together, like text + number. Convert with int(), float() or str().",
  IndexError: "That list position doesn’t exist. Positions start at 0, and the last one is -1.",
  ValueError: "The type is right but the value isn’t, like int(\"abc\").",
  ZeroDivisionError: "You divided by zero, which isn’t possible.",
  SyntaxError: "Python can’t read this line. Look for a missing colon, bracket, or quote.",
  IndentationError: "The spaces at the start of a line are wrong. Lines inside if, for, while and def need 4 spaces.",
  KeyError: "That key isn’t in the dictionary. Check the spelling and capital letters.",
  AttributeError: "This value doesn’t have that tool. Check the spelling after the dot.",
  ModuleNotFoundError: "That library isn’t available here. This course uses plain Python only."
};

/* ---------- Progress ---------- */
function doneCount() { return ALL_EX.filter(id => state.done[id]).length; }
function renderProgress() {
  const k = doneCount();
  const pct = Math.round(k / TOTAL * 100);
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("bar-fill").style.width = pct + "%";
  document.getElementById("pct-note").textContent = k === TOTAL ? `All ${TOTAL} exercises solved` : `${k} of ${TOTAL} exercises solved`;
}

/* ---------- Sidebar ---------- */
function renderSidebar() {
  const ul = document.getElementById("modlist");
  ul.innerHTML = "";
  MODULES.forEach((m, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "mod-btn";

    li.appendChild(b); ul.appendChild(li);

/* ---------- Editor ---------- */
function makeEditor(value, onChange, onSubmit) {
  const ta = document.createElement("textarea");
  ta.className = "code"; ta.spellcheck = false; ta.autocapitalize = "off"; ta.autocomplete = "off";
  ta.setAttribute("autocorrect", "off");
  ta.setAttribute("aria-label", "Code editor");
  ta.value = value;
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.max(140, ta.scrollHeight + 4) + "px"; };
  ta.addEventListener("input", () => { onChange && onChange(ta.value); fit(); });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onSubmit && onSubmit(); return; }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      onChange && onChange(ta.value); fit();
    } else if (e.key === "Enter") {
      const s = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf("\n", s - 1) + 1;
      const line = ta.value.slice(lineStart, s);
      let indent = (line.match(/^ */) || [""])[0];
      if (/:\s*$/.test(line)) indent += "    ";
      if (indent) {
        e.preventDefault();
        ta.value = ta.value.slice(0, s) + "\n" + indent + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 1 + indent.length;
        onChange && onChange(ta.value); fit();
      }
    }
  });
  requestAnimationFrame(fit);
  return ta;
}

function makeConsole() {
  const con = document.createElement("div");
  con.className = "console";
  con.innerHTML = `<div class="console-head">Output</div><pre aria-live="polite">Press Run to see what your code prints.</pre><div class="verdict" hidden></div>`;
  return con;
}

function showResult(con, res, isCheck) {
  con.className = "console";
  const head = con.querySelector(".console-head");
  const pre = con.querySelector("pre");
  const verdict = con.querySelector(".verdict");
  pre.textContent = "";
  if (res.out) pre.append(document.createTextNode(res.out));
  if (res.err) {
    const s = document.createElement("span"); s.className = "err-line";
    s.textContent = (res.out && !res.out.endsWith("\n") ? "\n" : "") + res.err;
    pre.append(s);
  }
  if (!res.out && !res.err && !isCheck && !res.msg) pre.textContent = "(your code ran, but nothing was printed)";
  verdict.hidden = true; verdict.className = "verdict";
  if (res.err) {
    const name = (res.err.match(/^(\w+)/) || [])[1];
    head.textContent = "Error";
    con.classList.add("fail");
    verdict.hidden = false; verdict.classList.add("fail");
    verdict.textContent = FRIENDLY[name] || "Read the error name above. It tells you what kind of problem it is.";
  } else if (isCheck) {
    head.textContent = res.ok ? "Correct" : "Not yet";
    con.classList.add(res.ok ? "pass" : "fail");
    verdict.hidden = false; verdict.classList.add(res.ok ? "pass" : "fail");
    verdict.textContent = res.ok ? "Well done. Exercise solved." : (res.msg || "Not quite. Compare your output with the task.");
  } else {
    head.textContent = "Output";
    if (res.msg) { verdict.hidden = false; verdict.textContent = res.msg; }
  }
}

    helper.hidden = false;
    helper.innerHTML = "<h3>Solution</h3><p>Read it, understand each line, then type it yourself instead of copying. That’s how it sticks.</p>";
    const pre = document.createElement("pre"); pre.textContent = ex.solution; helper.appendChild(pre);
  });
  resetBtn.addEventListener("click", () => {
    code = ex.starter; ta.value = code; delete state.code[ex.id]; save(); ta.dispatchEvent(new Event("input"));
  });
  actions.append(runBtn, checkBtn, hintBtn, solBtn, resetBtn);
  main.append(actions, con, helper);

  prevBtn.addEventListener("click", () => {
    if (state.ex > 0) state.ex--; else { state.mod--; state.ex = MODULES[state.mod].exercises.length - 1; }
    save(); render(); window.scrollTo(0, 0);
  });
  nextBtn.addEventListener("click", () => {
    if (!isLastEx) state.ex++;
    else if (isLastMod) { state.mod = 0; state.ex = 0; }
    else { state.mod++; state.ex = 0; }
    save(); render(); window.scrollTo(0, 0);
  });
  nextRow.append(prevBtn, nextBtn);
  main.appendChild(nextRow);

  function showFinish() {
    const f = document.createElement("div"); f.className = "finish";
    f.innerHTML = "<h2>You finished every exercise</h2><p>You now know the core of Python: variables, maths, text, lists, decisions, loops, functions, dictionaries and debugging. That’s the foundation everything else is built on.</p>";
    main.appendChild(f);
  }
  if (doneCount() === TOTAL) showFinish();
}

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Erase all progress and saved code?")) return;
  state = { done: {}, code: {}, mod: 0, ex: 0 }; save(); render();
});

if (state.mod >= MODULES.length) state.mod = 0;
render();
setEngine("loading");
window.addEventListener("load", startEngineWatch);
</script>
